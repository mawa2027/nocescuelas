<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOC - Ingreso</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0f1e; font-family: 'Segoe UI', 'Roboto', sans-serif; color: #e2e8f0;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { background: #1a2639; border: 1px solid #2d3a5e; border-radius: 12px; padding: 35px;
         width: 100%; max-width: 380px; margin: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  h1 { color: white; font-size: 24px; letter-spacing: 1px; text-align: center; }
  .sub { color: #94a3b8; font-size: 13px; text-align: center; margin: 6px 0 25px; }
  label { display: block; color: #94a3b8; font-size: 11px; text-transform: uppercase;
          letter-spacing: 0.5px; font-weight: 600; margin: 14px 0 5px; }
  input[type=text], input[type=password] { width: 100%; background: #0a0f1e; border: 1px solid #2d3a5e;
          border-radius: 8px; padding: 12px 14px; color: white; font-size: 15px; }
  input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
  button { width: 100%; margin-top: 24px; background: #2563eb; border: 1px solid #3b82f6; color: white;
           font-weight: 600; letter-spacing: 0.5px; padding: 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:hover { background: #3b82f6; }
  .error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444;
           padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
  <div class="box">
    <h1>SISTEMA NOC</h1>
    <div class="sub">Ingreso de operadores</div>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="u">Usuario</label>
      <input id="u" type="text" name="username" autofocus required autocomplete="username">
      <label for="p">Contraseña</label>
      <input id="p" type="password" name="password" required autocomplete="current-password">
      {% if form.errors %}<div class="error">Usuario o contraseña incorrectos.</div>{% endif %}
      <button type="submit">INGRESAR</button>
    </form>
  </div>
</body>
</html>
