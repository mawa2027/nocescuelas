<!DOCTYPE html>
<html>
<head>
    <title>Diagnóstico</title>
    <style>
        body {
            background:#111;
            color:#eee;
            font-family: Arial;
        }

        .card {
            background:#222;
            padding:20px;
            width:600px;
            border-radius:10px;
        }

        label {
            display:block;
            margin-top:10px;
        }

        button {
            margin-top:20px;
            padding:10px;
            background:#4db8ff;
            border:none;
            color:black;
            font-weight:bold;
            cursor:pointer;
        }
    </style>
</head>

<body>

<a href="/escuelas/{{ escuela.id }}/">← Volver a la escuela</a>

<div class="card">
    <h2>{{ escuela.escuelas }}</h2>
    <p><b>CUE:</b> {{ escuela.cue }}</p>

    <form method="post">
        {% csrf_token %}
	<h4>Electricidad</h4>

        <label>¿Tiene energía eléctrica?</label><br>
        <label><input type="radio" name="tiene_energia" value="1"> Sí</label>
        <label><input type="radio" name="tiene_energia" value="0"> No</label>

        <label>¿Navega?
            <select name="navega">
                <option value="">---</option>
                <option value="1">Sí</option>
                <option value="0">No</option>
            </select>
        </label>

        <label>¿Navega lento?
            <select name="navega_lento">
                <option value="">---</option>
                <option value="1">Sí</option>
                <option value="0">No</option>
            </select>
        </label>

        <label>¿Ve red Estudiante?
            <select name="ve_red_estudiante">
                <option value="">---</option>
                <option value="1">Sí</option>
                <option value="0">No</option>
            </select>
        </label>

        <label>¿Ve red Docente?
            <select name="ve_red_docente">
                <option value="">---</option>
                <option value="1">Sí</option>
                <option value="0">No</option>
            </select>
        </label>

        <label>¿UTM prendido?
            <select name="luces_utmc">
                <option value="">---</option>
                <option value="1">Sí</option>
                <option value="0">No</option>
            </select>
        </label>

        <label>¿Switch prendido?
            <select name="luces_switch">
                <option value="">---</option>
                <option value="1">Sí</option>
                <option value="0">No</option>
            </select>
        </label>

        <label>¿Modem / Mikrotik prendido?
            <select name="luces_modem">
                <option value="">---</option>
                <option value="1">Sí</option>
                <option value="0">No</option>
            </select>
        </label>
        <h4>Observaciones del operador</h4>

        <textarea name="observaciones"
        rows="4"
        style="width:100%;"
        placeholder="Ej: se conectó una PC directa al módem, sin navegación..."></textarea>

        <button type="submit">
            Generar diagnóstico
        </button>

    </form>
</div>

</body>
</html>
